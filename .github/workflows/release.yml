name: Release
# After CI passes on main: tag v<package.json version> and publish a GitHub release, unless that
# tag exists. `npx github:shayshahal/lint-kit#v<version> init` runs that tag once this has run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
            exit 0
          fi
          # The notes are the CHANGELOG's section for this version, so the release page and the
          # file cannot disagree. test/version.test.js fails when the section is missing or empty;
          # the check here is the second one, because a silent empty release is worse than a
          # failed job.
          awk -v version="${tag#v}" 'BEGIN { found = 0 } $0 == "## " version { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${tag#v}" >&2
            exit 1
          fi
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file notes.md
