name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      # the oxlint plugins under tools/ are shipped to other repositories, and only tsc reads their
      # types: node --test runs them the way oxlint does, with the types erased
      - run: pnpm typecheck
      # before the JS tests: init.test.js runs the real flake8 and ruff from python/.venv
      - run: uv sync --frozen
        working-directory: python
      # tools/python is what init copies; python/ is its dev environment and holds the ruff config
      - run: uv run ruff check --config pyproject.toml . ../tools/python && uv run ruff format --check --config pyproject.toml . ../tools/python
        working-directory: python
      - run: uv run pytest -q
        working-directory: python
      # the secret-scanning tests run the real, pinned Gitleaks: this downloads the release asset,
      # verifies the recorded checksum and caches it, so the tests never skip on a missing tool
      - run: node test/gitleaks-binary.js
      - run: pnpm test
