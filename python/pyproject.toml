# The dev environment for tools/python: the files init copies into a project, and their tests.
[project]
name = "lint-kit-python-tools"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["flake8>=7", "fastapi>=0.100", "mccabe>=0.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["tests", "../tools/python"]
testpaths = ["tests"]
